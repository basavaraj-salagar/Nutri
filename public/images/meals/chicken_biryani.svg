<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <radialGradient id="cbG" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="chkG" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ea580c"/><stop offset="70%" stop-color="#9a3412"/><stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <filter id="cbSh"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="320" height="220" fill="#fff1f2"/>
  <!-- Plate -->
  <ellipse cx="160" cy="130" rx="125" ry="60" fill="#cbd5e1" filter="url(#cbSh)"/>
  <ellipse cx="160" cy="126" rx="118" ry="54" fill="#ffffff"/>
  <!-- Spiced Biryani Rice -->
  <ellipse cx="160" cy="122" rx="98" ry="42" fill="url(#cbG)"/>
  <!-- Chicken Leg / Piece -->
  <g filter="url(#cbSh)">
    <path d="M 120,110 C 110,85 150,75 175,95 C 190,105 170,130 145,125 Z" fill="url(#chkG)"/>
    <!-- Bone tip -->
    <path d="M 115,108 C 105,105 95,115 105,120" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Fried Onion (Birista) and Mint -->
  <path d="M 170,120 Q 185,112 205,122" stroke="#451a03" stroke-width="2.5" fill="none"/>
  <circle cx="180" cy="115" r="3.5" fill="#16a34a"/><circle cx="185" cy="112" r="3" fill="#22c55e"/>
  <!-- Boiled egg slice -->
  <ellipse cx="195" cy="125" rx="12" ry="8" fill="#ffffff" filter="url(#cbSh)"/>
  <circle cx="195" cy="125" r="5" fill="#fbbf24"/>
  <text x="160" y="202" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#be123c" text-anchor="middle">Aromatic Chicken Biryani</text>
</svg>