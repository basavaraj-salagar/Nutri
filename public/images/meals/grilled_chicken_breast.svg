      <stop offset="0%" stop-color="#fed7aa"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="msh"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="320" height="220" fill="#f8fafc"/>
