<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <radialGradient id="fcG" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb923c"/><stop offset="60%" stop-color="#ea580c"/><stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
    <filter id="fcSh"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="320" height="220" fill="#fff1f2"/>
  <!-- Clay Pot Bowl -->
  <path d="M 65,115 Q 60,175 160,185 Q 260,175 255,115 Z" fill="#7c2d12" filter="url(#fcSh)"/>
  <ellipse cx="160" cy="115" rx="95" ry="32" fill="#451a03"/>
  <!-- Curry -->
  <ellipse cx="160" cy="115" rx="90" ry="28" fill="url(#fcG)"/>
  <!-- Fish Steak / Fillet -->
  <g filter="url(#fcSh)">
    <path d="M 120,115 Q 160,95 200,115 Q 160,135 120,115 Z" fill="#fed7aa"/>
    <ellipse cx="160" cy="115" rx="35" ry="12" fill="#fdba74"/>
    <!-- Center bone circle -->
    <circle cx="160" cy="115" r="4" fill="#ffffff"/><circle cx="160" cy="115" r="2" fill="#78350f"/>
    <!-- Seasoned crust lines -->
    <path d="M 135,110 Q 145,108 150,114" stroke="#c2410c" stroke-width="2" fill="none"/>
    <path d="M 170,112 Q 180,110 185,118" stroke="#c2410c" stroke-width="2" fill="none"/>
  </g>
  <!-- Green chili & curry leaves -->
  <path d="M 130,122 Q 140,126 150,123" stroke="#16a34a" stroke-width="2.5" fill="none"/>
  <text x="160" y="205" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">Coastal Fish Curry</text>
</svg>