<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <radialGradient id="leafGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="idliGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="70%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="320" height="220" fill="#f0fdf4"/>
  <!-- Banana Leaf -->
  <path d="M 30,170 C 50,70 160,35 290,55 C 310,135 230,195 70,185 Z" fill="url(#leafGrad)" opacity="0.9"/>
  <!-- Leaf rib lines -->
  <path d="M 60,165 Q 160,110 270,65" stroke="#047857" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 120,135 Q 150,95 180,80" stroke="#047857" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 170,115 Q 210,85 240,75" stroke="#047857" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Idli 1 -->
  <g filter="url(#shadow)">
    <ellipse cx="120" cy="115" rx="42" ry="32" fill="url(#idliGrad)"/>
    <ellipse cx="118" cy="112" rx="36" ry="26" fill="#ffffff" opacity="0.7"/>
    <!-- Idli texture pores -->
    <circle cx="105" cy="110" r="1.5" fill="#cbd5e1"/>
    <circle cx="125" cy="118" r="1.5" fill="#cbd5e1"/>
    <circle cx="132" cy="108" r="1.5" fill="#cbd5e1"/>
  </g>
  <!-- Idli 2 -->
  <g filter="url(#shadow)">
    <ellipse cx="175" cy="130" rx="42" ry="32" fill="url(#idliGrad)"/>
    <ellipse cx="173" cy="127" rx="36" ry="26" fill="#ffffff" opacity="0.7"/>
    <circle cx="165" cy="125" r="1.5" fill="#cbd5e1"/>
    <circle cx="185" cy="133" r="1.5" fill="#cbd5e1"/>
  </g>
  <!-- Chutney Bowls -->
  <circle cx="230" cy="90" r="22" fill="#fff" filter="url(#shadow)"/>
  <circle cx="230" cy="90" r="18" fill="#ecfdf5"/>
  <circle cx="230" cy="90" r="15" fill="#10b981"/> <!-- Green Chutney -->
  <circle cx="75" cy="95" r="22" fill="#fff" filter="url(#shadow)"/>
  <circle cx="75" cy="95" r="18" fill="#fef2f2"/>
  <circle cx="75" cy="95" r="15" fill="#f97316"/> <!-- Sambar / Red Chutney -->
  <circle cx="73" cy="93" r="3" fill="#ea580c"/>
  <text x="160" y="200" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">Steamed Idli</text>
</svg>