<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <radialGradient id="crG" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="70%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="crSh"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="320" height="220" fill="#f0fdf4"/>
  <!-- Bowl -->
  <ellipse cx="160" cy="130" rx="100" ry="48" fill="#94a3b8" filter="url(#crSh)"/>
  <path d="M 65,125 Q 160,195 255,125 Q 255,110 160,110 Q 65,110 65,125 Z" fill="#ffffff"/>
  <!-- Curd Rice Surface -->
  <ellipse cx="160" cy="115" rx="88" ry="36" fill="url(#crG)"/>
  <!-- Tempering: Mustard, Curry Leaves & Pomegranate -->
  <circle cx="140" cy="112" r="1.5" fill="#0f172a"/><circle cx="170" cy="118" r="1.5" fill="#0f172a"/>
  <circle cx="155" cy="108" r="1.5" fill="#0f172a"/><circle cx="185" cy="110" r="1.5" fill="#0f172a"/>
  <!-- Curry Leaves -->
  <ellipse cx="150" cy="118" rx="8" ry="4" fill="#15803d" transform="rotate(-20 150 118)"/>
  <ellipse cx="175" cy="112" rx="7" ry="3.5" fill="#16a34a" transform="rotate(30 175 112)"/>
  <!-- Pomegranate Jewels -->
  <circle cx="130" cy="118" r="3.5" fill="#be123c"/><circle cx="162" cy="122" r="3.5" fill="#9f1239"/>
  <circle cx="190" cy="116" r="3.5" fill="#e11d48"/>
  <text x="160" y="200" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">South Indian Curd Rice</text>
</svg>