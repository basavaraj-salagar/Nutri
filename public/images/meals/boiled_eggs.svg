<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <radialGradient id="yolkG" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <filter id="eggSh"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="320" height="220" fill="#fff1f2"/>
  <!-- Small Dish -->
  <ellipse cx="160" cy="130" rx="110" ry="50" fill="#e2e8f0" filter="url(#eggSh)"/>
  <ellipse cx="160" cy="126" rx="104" ry="45" fill="#ffffff"/>
  <!-- Egg 1 Halved -->
  <g filter="url(#eggSh)">
    <ellipse cx="125" cy="118" rx="35" ry="26" fill="#f8fafc"/>
    <ellipse cx="125" cy="116" rx="32" ry="23" fill="#ffffff"/>
    <circle cx="125" cy="116" r="14" fill="url(#yolkG)"/>
    <!-- Black pepper specks -->
    <circle cx="120" cy="112" r="1" fill="#334155"/><circle cx="128" cy="120" r="1" fill="#334155"/>
  </g>
  <!-- Egg 2 Halved -->
  <g filter="url(#eggSh)">
    <ellipse cx="185" cy="122" rx="35" ry="26" fill="#f8fafc"/>
    <ellipse cx="185" cy="120" rx="32" ry="23" fill="#ffffff"/>
    <circle cx="185" cy="120" r="14" fill="url(#yolkG)"/>
    <circle cx="182" cy="116" r="1" fill="#334155"/><circle cx="190" cy="122" r="1" fill="#334155"/>
  </g>
  <text x="160" y="198" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#be123c" text-anchor="middle">Boiled Eggs</text>
</svg>