<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <radialGradient id="dosaGrad" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fed7aa"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="dosaShadow">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="320" height="220" fill="#fffbeb"/>
  <!-- Plate -->
  <ellipse cx="160" cy="125" rx="140" ry="70" fill="#e2e8f0" opacity="0.7"/>
  <ellipse cx="160" cy="122" rx="134" ry="64" fill="#ffffff"/>
  <!-- Dosa roll / cone -->
  <g filter="url(#dosaShadow)">
    <path d="M 40,135 Q 160,85 275,100 L 265,130 Q 155,145 45,145 Z" fill="url(#dosaGrad)"/>
    <!-- Crisp spots and swirls -->
    <path d="M 60,136 Q 160,95 260,105" stroke="#92400e" stroke-dasharray="8,6" stroke-width="2.5" fill="none"/>
    <ellipse cx="150" cy="115" rx="25" ry="8" fill="#d97706" opacity="0.6"/>
    <ellipse cx="210" cy="118" rx="18" ry="6" fill="#b45309" opacity="0.5"/>
  </g>
  <!-- Sambar bowl -->
  <circle cx="90" cy="80" r="22" fill="#ffffff" filter="url(#dosaShadow)"/>
  <circle cx="90" cy="80" r="17" fill="#ea580c"/>
  <circle cx="88" cy="78" r="4" fill="#fed7aa" opacity="0.8"/>
  <!-- Coconut Chutney -->
  <circle cx="150" cy="65" r="18" fill="#ffffff" filter="url(#dosaShadow)"/>
  <circle cx="150" cy="65" r="14" fill="#f8fafc"/>
  <circle cx="152" cy="64" r="2" fill="#047857"/>
  <!-- Tomato Chutney -->
  <circle cx="210" cy="70" r="18" fill="#ffffff" filter="url(#dosaShadow)"/>
  <circle cx="210" cy="70" r="14" fill="#ef4444"/>
  <text x="160" y="200" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Crispy Dosa</text>
</svg>