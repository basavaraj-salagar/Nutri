<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <radialGradient id="vbG" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <filter id="vbSh"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="320" height="220" fill="#fffbeb"/>
  <!-- Handi / Plate -->
  <ellipse cx="160" cy="125" rx="120" ry="55" fill="#e2e8f0" filter="url(#vbSh)"/>
  <!-- Layered Spiced Rice Mound -->
  <ellipse cx="160" cy="118" rx="95" ry="42" fill="url(#vbG)"/>
  <!-- Garnish: Fried onions, paneer, mint -->
  <path d="M 120,110 Q 135,102 150,112" stroke="#78350f" stroke-width="2" fill="none"/>
  <path d="M 160,105 Q 175,98 190,108" stroke="#78350f" stroke-width="2" fill="none"/>
  <!-- Veggie chunks (beans, peas, carrots) -->
  <circle cx="135" cy="120" r="4" fill="#16a34a"/>
  <circle cx="185" cy="115" r="4" fill="#22c55e"/>
  <rect x="145" y="115" width="7" height="6" rx="1" fill="#ea580c"/>
  <rect x="165" y="122" width="7" height="6" rx="1" fill="#f97316"/>
  <!-- Mint leaves -->
  <circle cx="160" cy="105" r="3.5" fill="#15803d"/><circle cx="165" cy="103" r="3" fill="#16a34a"/>
  <text x="160" y="200" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">Vegetable Biryani</text>
</svg>