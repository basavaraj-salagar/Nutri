<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs><filter id="banSh"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.2"/></filter></defs>
  <rect width="320" height="220" fill="#f0fdf4"/>
  <ellipse cx="160" cy="150" rx="95" ry="25" fill="#cbd5e1" opacity="0.6"/>
  <!-- Curved Banana -->
  <g filter="url(#banSh)">
    <path d="M 90,80 C 105,140 180,165 240,115 C 235,130 150,150 90,80 Z" fill="#facc15"/>
    <path d="M 90,80 C 110,135 180,155 240,115" stroke="#ca8a04" stroke-width="2" fill="none"/>
    <!-- Stems -->
    <rect x="85" y="75" width="8" height="12" rx="2" fill="#65a30d"/>
    <circle cx="240" cy="115" r="3" fill="#78350f"/>
  </g>
  <text x="160" y="202" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Fresh Banana</text>
</svg>