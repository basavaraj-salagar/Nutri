<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <radialGradient id="samG" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fde047"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="sh"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="320" height="220" fill="#f0fdf4"/>
  <!-- Plate -->
  <ellipse cx="160" cy="135" rx="120" ry="55" fill="#e2e8f0" filter="url(#sh)"/>
  <ellipse cx="160" cy="132" rx="114" ry="50" fill="#ffffff"/>
  <!-- Samosa 1 (Back) -->
  <polygon points="120,70 70,145 170,145" fill="#d97706" filter="url(#sh)"/>
  <polygon points="120,73 75,142 165,142" fill="url(#samG)"/>
  <!-- Samosa 2 (Front) -->
  <polygon points="185,65 130,148 240,148" fill="#b45309" filter="url(#sh)"/>
  <polygon points="185,68 135,145 235,145" fill="url(#samG)"/>
  <!-- Crimp edges & blister spots -->
  <path d="M 135,145 Q 185,152 235,145" stroke="#78350f" stroke-width="3" fill="none"/>
  <circle cx="170" cy="110" r="3" fill="#92400e" opacity="0.6"/>
  <circle cx="195" cy="125" r="2.5" fill="#92400e" opacity="0.6"/>
  <!-- Mint chutney bowl -->
  <circle cx="85" cy="100" r="18" fill="#ffffff" filter="url(#sh)"/>
  <circle cx="85" cy="100" r="14" fill="#15803d"/>
  <text x="160" y="202" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Golden Crispy Samosa</text>
</svg>