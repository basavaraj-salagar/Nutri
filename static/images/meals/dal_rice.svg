  <circle cx="162" cy="118" r="3" fill="#16a34a"/>
  <text x="160" y="200" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#ca8a04" text-anchor="middle">Homestyle Dal Rice</text>
