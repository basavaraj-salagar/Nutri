      <stop offset="0%" stop-color="#fde047"/><stop offset="60%" stop-color="#eab308"/><stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="drSh"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="320" height="220" fill="#fef9c3"/>
  <!-- Thali / Plate -->
  <ellipse cx="160" cy="125" rx="130" ry="62" fill="#cbd5e1" filter="url(#drSh)"/>
  <ellipse cx="160" cy="122" rx="124" ry="56" fill="#f8fafc"/>
