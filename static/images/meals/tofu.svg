<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs><filter id="tfSh"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.18"/></filter></defs>
  <rect width="320" height="220" fill="#f0fdf4"/>
  <ellipse cx="160" cy="135" rx="120" ry="55" fill="#e2e8f0" filter="url(#tfSh)"/>
  <!-- Tofu Blocks -->
  <g filter="url(#tfSh)">
    <!-- Block 1 -->
    <polygon points="100,105 140,90 170,110 130,128" fill="#f8fafc"/>
    <polygon points="100,105 130,128 130,150 100,128" fill="#e2e8f0"/>
    <polygon points="130,128 170,110 170,132 130,150" fill="#cbd5e1"/>
    <!-- Block 2 -->
    <polygon points="150,112 190,98 220,118 180,135" fill="#ffffff"/>
    <polygon points="150,112 180,135 180,155 150,132" fill="#e2e8f0"/>
    <polygon points="180,135 220,118 220,138 180,155" fill="#cbd5e1"/>
  </g>
  <!-- Scallions and sesame seeds -->
  <circle cx="140" cy="115" r="3" fill="#16a34a"/><circle cx="190" cy="120" r="3" fill="#15803d"/>
  <circle cx="160" cy="122" r="1.5" fill="#334155"/><circle cx="175" cy="112" r="1.5" fill="#334155"/>
  <text x="160" y="202" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">Organic Firm Tofu</text>
</svg>