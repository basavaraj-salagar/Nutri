<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs><filter id="sh5"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.18"/></filter></defs>
  <rect width="320" height="220" fill="#f0fdf4"/>
  <!-- Plate -->
  <ellipse cx="160" cy="135" rx="120" ry="55" fill="#e2e8f0" filter="url(#sh5)"/>
  <!-- Triangle Sandwich 1 -->
  <g filter="url(#sh5)">
    <!-- Top bread -->
    <polygon points="80,135 150,75 165,135" fill="#fed7aa"/>
    <!-- Fillings: Green Chutney, Tomato, Cucumber, Cheese -->
    <polygon points="80,135 165,135 165,142 80,142" fill="#16a34a"/>
    <polygon points="80,142 165,142 165,147 80,147" fill="#ef4444"/>
    <polygon points="80,147 165,147 165,152 80,152" fill="#86efac"/>
    <polygon points="80,152 165,152 165,158 80,158" fill="#fef08a"/>
    <!-- Bottom bread -->
    <polygon points="80,158 165,158 165,165 80,165" fill="#d97706"/>
  </g>
  <!-- Triangle Sandwich 2 -->
  <g filter="url(#sh5)">
    <polygon points="160,135 235,80 245,135" fill="#fed7aa"/>
    <polygon points="160,135 245,135 245,142 160,142" fill="#16a34a"/>
    <polygon points="160,142 245,142 245,147 160,147" fill="#ef4444"/>
    <polygon points="160,147 245,147 245,158 160,158" fill="#fde047"/>
    <polygon points="160,158 245,158 245,165 160,165" fill="#d97706"/>
  </g>
  <text x="160" y="202" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Club Veg Sandwich</text>
</svg>