<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs><filter id="sh9"><feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.2"/></filter></defs>
  <rect width="320" height="220" fill="#f0fdf4"/>
  <!-- Skewer line -->
  <line x1="60" y1="130" x2="260" y2="130" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <!-- Cubes on Skewer: Paneer, Capsicum, Onion -->
  <g filter="url(#sh9)">
    <rect x="80" y="112" width="28" height="34" rx="4" fill="#16a34a"/> <!-- Capsicum -->
    <rect x="115" y="108" width="34" height="42" rx="4" fill="#fb923c"/> <!-- Paneer Cube 1 -->
    <rect x="120" y="112" width="24" height="34" fill="#ffffff" opacity="0.9"/>
    <!-- Char marks -->
    <line x1="120" y1="120" x2="140" y2="120" stroke="#7c2d12" stroke-width="2"/>
    <rect x="155" y="112" width="26" height="34" rx="4" fill="#f43f5e"/> <!-- Onion -->
    <rect x="188" y="108" width="34" height="42" rx="4" fill="#fb923c"/> <!-- Paneer Cube 2 -->
    <rect x="193" y="112" width="24" height="34" fill="#ffffff" opacity="0.9"/>
    <line x1="193" y1="124" x2="213" y2="124" stroke="#7c2d12" stroke-width="2"/>
    <rect x="228" y="112" width="24" height="34" rx="4" fill="#16a34a"/>
  </g>
  <!-- Mint garnish -->
  <circle cx="160" cy="85" r="4" fill="#15803d"/>
  <text x="160" y="202" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Tandoori Paneer Tikka</text>
</svg>