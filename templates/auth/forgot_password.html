{% extends "base.html" %}

{% block title %}Reset Password - NutriTrack{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
    <div class="card" style="padding: 2.25rem 2rem; border-top: 4px solid var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.08);">
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.25rem;">🔒</div>
            <h1 style="font-size: 1.65rem; color: var(--primary-dark); font-weight: 800;">Reset Your Password</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
                Enter your registered email address and choose a new secure password.
            </p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password_view') }}">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="email" style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; display: block;">
                    Email Address <span style="color: #ef4444;">*</span>
                </label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required style="padding: 0.7rem 0.85rem;">
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="new_password" style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; display: block;">
                    New Password <span style="color: #ef4444;">*</span>
                </label>
                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="At least 6 characters" minlength="6" required style="padding: 0.7rem 0.85rem;">
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="confirm_password" style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; display: block;">
                    Confirm New Password <span style="color: #ef4444;">*</span>
                </label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" minlength="6" required style="padding: 0.7rem 0.85rem;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; font-weight: 700; border-radius: 8px;">
                Reset Password
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
            Remember your password? 
            <a href="{{ url_for('login_view') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">
                Return to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
