{% extends "base.html" %}

{% block title %}Create Account - NutriTrack{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto;">
    <div class="card" style="padding: 2.25rem 2rem; border-top: 4px solid var(--secondary); box-shadow: 0 10px 25px rgba(0,0,0,0.08);">
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.25rem;">🥗</div>
            <h1 style="font-size: 1.65rem; color: var(--primary-dark); font-weight: 800;">Create Your NutriTrack Account</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
                Start tracking your meals and getting personalized recipes today.
            </p>
        </div>

        <form method="POST" action="{{ url_for('register_view') }}">
            <div class="form-group" style="margin-bottom: 1.15rem;">
                <label for="name" style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.35rem; display: block;">
                    Full Name <span style="color: #ef4444;">*</span>
                </label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Alex Smith" value="{{ request.form.get('name', '') }}" required autofocus style="padding: 0.65rem 0.85rem;">
            </div>

            <div class="form-group" style="margin-bottom: 1.15rem;">
                <label for="email" style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.35rem; display: block;">
                    Email Address <span style="color: #ef4444;">*</span>
                </label>
                <input type="email" id="email" name="email" class="form-control" placeholder="alex@example.com" value="{{ request.form.get('email', '') }}" required style="padding: 0.65rem 0.85rem;">
            </div>

            <div class="grid-2" style="gap: 1rem; margin-bottom: 1.15rem;">
                <div class="form-group">
                    <label for="password" style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.35rem; display: block;">
                        Password <span style="color: #ef4444;">*</span>
                    </label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 chars" required minlength="6" style="padding: 0.65rem 0.85rem;">
                </div>
                <div class="form-group">
                    <label for="confirm_password" style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.35rem; display: block;">
                        Confirm Password <span style="color: #ef4444;">*</span>
                    </label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required minlength="6" style="padding: 0.65rem 0.85rem;">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="diet_preference" style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.35rem; display: block;">
                    Primary Dietary Preference
                </label>
                <select id="diet_preference" name="diet_preference" class="form-control" style="padding: 0.65rem 0.85rem;">
                    <option value="all">Omnivore (Everything / Non-Veg & Veg)</option>
                    <option value="vegetarian">Vegetarian (Dairy, no meat or fish)</option>
                    <option value="vegan">Vegan (100% plant-based)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; font-weight: 700; border-radius: 8px; box-shadow: 0 4px 10px rgba(22, 101, 52, 0.25);">
                Create Account & Go to Dashboard
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? 
            <a href="{{ url_for('login_view') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">
                Log In
            </a>
            &bull;
            <a href="{{ url_for('demo_login_view') }}" style="color: var(--secondary); font-weight: 700; text-decoration: none;">
                Try Demo
            </a>
        </div>
    </div>
</div>
{% endblock %}
